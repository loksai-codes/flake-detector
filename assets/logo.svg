<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Flake / Gauge Accent Gradients -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-pulse" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="240" rx="20" fill="url(#bg-grad)"/>
  <rect width="800" height="240" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Icon Section (Left) -->
  <g transform="translate(45, 30)">
    <!-- Radar / Confidence Rings -->
    <circle cx="90" cy="90" r="75" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="90" cy="90" r="55" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="90" cy="90" r="35" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="2 4"/>

    <!-- Variance Area / Confidence Polygon -->
    <polygon points="90,25 142,65 130,135 60,145 42,75" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="2"/>

    <!-- Flake Geometric Nodes -->
    <line x1="90" y1="20" x2="90" y2="160" stroke="url(#cyan-violet)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="90" x2="160" y2="90" stroke="url(#cyan-violet)" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="140" y2="140" stroke="url(#cyan-violet)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="140" y1="40" x2="40" y2="140" stroke="url(#cyan-violet)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Flake Branchlets -->
    <path d="M90 45 L78 35 M90 45 L102 35 M90 135 L78 145 M90 135 L102 145" stroke="url(#cyan-violet)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M45 90 L35 78 M45 90 L35 102 M135 90 L145 78 M135 90 L145 102" stroke="url(#cyan-violet)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nodes & Center Indicator -->
    <circle cx="90" cy="90" r="8" fill="#0f172a" stroke="url(#accent-pulse)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="90" cy="25" r="4" fill="#38bdf8"/>
    <circle cx="142" cy="65" r="4" fill="#818cf8"/>
    <circle cx="130" cy="135" r="4" fill="#c084fc"/>
    <circle cx="60" cy="145" r="4" fill="#f43f5e"/>
    <circle cx="42" cy="75" r="4" fill="#fb923c"/>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(265, 75)">
    <!-- Title -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#ffffff">flake</tspan><tspan fill="url(#cyan-violet)">-detector</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      AI Agent Consistency, Flakiness &amp; CI Regression Evaluator
    </text>

    <!-- Badges -->
    <g transform="translate(2, 102)">
      <!-- Badge: pass@k vs pass^k -->
      <rect x="0" y="0" width="138" height="24" rx="12" fill="#1e293b"/>
      <text x="12" y="16" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="600">pass@k vs pass^k</text>

      <!-- Badge: Wilson 95% CI -->
      <rect x="146" y="0" width="108" height="24" rx="12" fill="#1e293b"/>
      <text x="158" y="16" font-family="monospace" font-size="11" fill="#c084fc" font-weight="600">Wilson 95% CI</text>

      <!-- Badge: Zero Cost Sim -->
      <rect x="262" y="0" width="112" height="24" rx="12" fill="#1e293b"/>
      <text x="274" y="16" font-family="monospace" font-size="11" fill="#34d399" font-weight="600">CI Regression Gate</text>
    </g>
  </g>
</svg>
